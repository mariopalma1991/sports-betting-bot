<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA · Polymarket</title>
<style>
  :root {
    --fondo: #0f1115; --tarjeta: #171a21; --borde: #262a33; --texto: #e6e8ec;
    --suave: #8b919e; --verde: #3fb950; --rojo: #f0605d; --amarillo: #e3b341; --azul: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--fondo); border-bottom: 1px solid var(--borde);
           padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  .pestanas { display: flex; gap: 4px; }
  .pestanas button { background: none; border: 1px solid var(--borde); color: var(--suave); border-radius: 6px;
                     padding: 5px 12px; font: inherit; cursor: pointer; }
  .pestanas button.activa { color: var(--texto); border-color: var(--azul); }
  label { color: var(--suave); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #estado { margin-left: auto; color: var(--suave); font-size: 13px; }
  #estado.error { color: var(--amarillo); }
  main { padding: 20px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); }
  .vacio { grid-column: 1 / -1; color: var(--suave); text-align: center; padding: 60px 0; }
  .tarjeta[hidden] { display: none; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  .cabeza { padding: 12px 14px; display: flex; gap: 8px; align-items: baseline; }
  .cabeza h2 { font-size: 15px; margin: 0; flex: 1; }
  .cabeza a { color: var(--azul); text-decoration: none; font-size: 13px; }
  .hora { color: var(--suave); font-size: 13px; }
  .en-juego { color: var(--rojo); font-size: 12px; font-weight: 600; }
  .marcador:empty { display: none; }
  .marcador { padding: 10px 14px 12px; border-top: 1px solid var(--borde); }
  .estado-juego { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .estado-juego.vivo span:first-child { color: var(--rojo); }
  .estado-juego .gris { font-weight: 400; font-size: 12px; }
  .marcador table th, .marcador table td { padding: 3px 6px; border: 0; }
  .marcador table td:first-child { white-space: nowrap; }
  .marcador .total { font-weight: 700; font-size: 15px; }
  .lideres { display: grid; gap: 2px; margin-top: 8px; font-size: 12px; color: var(--suave); }
  .lideres b { color: var(--texto); font-weight: 500; }
  .widget { display: block; width: 100%; height: 300px; border: 0; background: #000; }
  .widget-demo { height: 300px; display: grid; place-items: center; text-align: center; padding: 0 20px; color: var(--suave);
                 background: repeating-linear-gradient(45deg, #13161c, #13161c 10px, #171a21 10px, #171a21 20px); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 10px; text-align: right; border-top: 1px solid var(--borde); white-space: nowrap; }
  th { color: var(--suave); font-weight: 500; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  .op { color: var(--verde); font-weight: 600; }
  .bajo { color: var(--rojo); }
  .gris { color: var(--suave); }
  footer { color: var(--suave); font-size: 12px; padding: 0 20px 24px; }
  [hidden] { display: none !important; }
  .controles { display: contents; }
  .vistas button.activa { color: var(--texto); border-color: var(--verde); }
  #bot { padding: 20px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(560px, 100%), 1fr));
         align-items: start; }
  .aviso { grid-column: 1 / -1; color: var(--suave); font-size: 13px; margin: 0; }
  .panel { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 16px; min-width: 0; }
  .panel h2 { font-size: 16px; margin: 0 0 4px; }
  .panel h3 { font-size: 13px; color: var(--suave); font-weight: 500; margin: 18px 0 6px; }
  .desc { color: var(--suave); font-size: 13px; margin: 0 0 14px; }
  .mensaje { background: #2a2414; color: var(--amarillo); border-radius: 6px; padding: 8px 10px; font-size: 13px; margin-bottom: 14px; }
  .cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
  .cifra span { display: block; color: var(--suave); font-size: 12px; }
  .cifra b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cifra.grande b { font-size: 26px; }
  .datos { color: var(--suave); font-size: 12px; margin: 10px 0 0; }
  .tabla { overflow-x: auto; }
  .panel td.izq, .panel th.izq { text-align: left; white-space: normal; }
  .gana { color: var(--verde); }
  .pierde { color: var(--rojo); }
  .pendiente { color: var(--amarillo); }
  @media (max-width: 480px) {
    main { padding: 12px; grid-template-columns: 1fr; }
    header { padding: 10px 12px; }
    #estado { margin-left: 0; width: 100%; }
    th, td { padding: 6px; }
    .precios th:last-child, .precios td:last-child { display: none; }  /* sin Vol 24h para que quepa */
    .panel { padding: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>NBA · Polymarket</h1>
  <div class="pestanas vistas">
    <button data-vista="partidos" class="activa">Partidos</button>
    <button data-vista="bot">Bot (papel)</button>
  </div>
  <div class="controles" id="controles">
    <div class="pestanas">
      <button data-dia="hoy" class="activa">Hoy</button>
      <button data-dia="manana">Mañana</button>
      <button data-dia="todos">Todos</button>
    </div>
    <label><input type="checkbox" id="oportunidades" checked> Solo oportunidades</label>
    <label><input type="checkbox" id="vacios"> Mercados sin órdenes</label>
  </div>
  <span id="estado">Cargando…</span>
</header>
<main id="partidos"></main>
<section id="bot" hidden></section>
<footer id="pie">
  <span class="op">●</span> oportunidad: al menos 2 ticks libres entre compra y venta, spread ≤ 6¢, volumen ≥ $5k y libro ≥ $200.
  <span class="bajo">Rojo</span> = poca liquidez (menos de $100 a ±2¢). No es consejo: el precio puede moverse.
</footer>
<script>
const contenedor = document.getElementById("partidos");
const estado = document.getElementById("estado");
const vacios = document.getElementById("vacios");
const soloOp = document.getElementById("oportunidades");
let dia = "hoy";
let ultimo = null;
const tarjetas = new Map();  // slug -> tarjeta; así el widget no se recarga en cada actualización

const fechaLocal = d => d.toLocaleDateString("en-CA");  // AAAA-MM-DD en tu zona horaria
const precio = (v, tick) => v == null ? "—" : v.toFixed(tick < 0.01 ? 3 : 2);
const centavos = v => v == null ? "—" : (v * 100).toFixed(1).replace(/\.0$/, "") + "¢";
const dinero = v => v >= 1000 ? "$" + (v / 1000).toFixed(1) + "k" : "$" + v.toFixed(0);

function delDia(p) {
  if (dia === "todos") return true;
  if (!p.inicio) return false;
  const inicio = new Date(p.inicio), hoy = new Date();
  const manana = new Date(hoy); manana.setDate(hoy.getDate() + 1);
  if (dia === "hoy") return fechaLocal(inicio) === fechaLocal(hoy) || enJuego(p);
  return fechaLocal(inicio) === fechaLocal(manana);
}

// Empezó hace menos de 3 h: lo más probable es que siga en juego.
// Con marcador de NBA.com se usa su estado; sin él, empezó hace menos de 3 h.
const enJuego = p => p.marcador ? p.marcador.estado === "en juego"
  : p.inicio && Date.now() - new Date(p.inicio) > 0 && Date.now() - new Date(p.inicio) < 3 * 3600e3;

function marcadorHtml(m) {
  if (!m) return "";
  const n = m.cuartos;
  const cuarto = i => i < 4 ? `Q${i + 1}` : n > 5 ? `OT${i - 3}` : "OT";
  const fila = e => `<tr><td>${esc(e.siglas)} <span class="gris">${esc(e.nombre)}</span></td>
    ${Array.from({ length: n }, (_, i) => `<td class="gris">${e.cuartos[i] ?? "–"}</td>`).join("")}
    <td class="total">${e.puntos ?? "–"}</td></tr>`;
  const etiqueta = m.estado === "por empezar"
    ? "Empieza " + (m.inicio ? new Date(m.inicio).toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" }) : "pronto")
    : m.etiqueta;
  return `<div class="estado-juego ${m.estado === "en juego" ? "vivo" : ""}"><span>${m.estado === "en juego" ? "● " : ""}${esc(etiqueta)}</span>
      <span class="gris">NBA.com</span></div>
    ${m.estado === "por empezar" ? "" : `<table><tr><th></th>${Array.from({ length: n }, (_, i) => `<th>${cuarto(i)}</th>`).join("")}<th>T</th></tr>
      ${fila(m.visitante)}${fila(m.local)}</table>`}
    ${m.lideres.length ? `<div class="lideres">${m.lideres.map(l => `<span><b>${esc(l.nombre)}</b> ${esc(l.equipo)} · ${l.puntos} pts · ${l.rebotes} reb · ${l.asistencias} ast</span>`).join("")}</div>` : ""}`;
}

function nuevaTarjeta(p) {
  const t = document.createElement("article");
  t.className = "tarjeta";
  t.innerHTML = `<div class="cabeza"><h2></h2><span class="hora"></span><span class="en-juego"></span><a target="_blank" rel="noopener">Polymarket ↗</a></div>`;
  t.querySelector("h2").textContent = p.titulo;
  const enlace = t.querySelector("a");
  if (p.enlace) enlace.href = p.enlace; else enlace.remove();
  if (p.widget) {
    const f = document.createElement("iframe");
    f.className = "widget";
    f.title = `${p.titulo}: probabilidades en vivo en Polymarket`;
    f.src = p.widget;
    f.loading = "lazy";
    f.setAttribute("allowtransparency", "true");
    t.append(f);
  } else {
    const d = document.createElement("div");
    d.className = "widget-demo";
    d.textContent = "Aquí va el widget de Polymarket (no se muestra en modo demo)";
    t.append(d);
  }
  const marcador = document.createElement("div");
  marcador.className = "marcador";
  const precios = document.createElement("table");
  precios.className = "precios";
  t.append(marcador, precios);
  return t;
}

function tabla(p) {
  const filas = p.mercados.filter(m => (vacios.checked || m.con_libro) && (!soloOp.checked || m.oportunidad));
  if (!filas.length) return `<tr><td class="gris">Sin órdenes en el libro todavía.</td></tr>`;
  const cuerpo = filas.map(m => `<tr>
      <td>${m.oportunidad ? '<span class="op">● </span>' : ""}${esc(m.tipo)} <span class="gris">· ${esc(m.resultado)}</span></td>
      <td>${precio(m.compra, m.tick)}</td><td>${precio(m.venta, m.tick)}</td>
      <td class="${m.oportunidad ? "op" : ""}">${centavos(m.spread)}</td>
      <td class="${m.profundidad < 100 ? "bajo" : ""}">${dinero(m.profundidad)}</td>
      <td>${dinero(m.volumen_24h)}</td></tr>`).join("");
  return `<tr><th>Mercado</th><th>Compra</th><th>Venta</th><th>Spread</th><th>Libro ±2¢</th><th>Vol 24h</th></tr>${cuerpo}`;
}

function esc(texto) {
  const d = document.createElement("div"); d.textContent = texto ?? ""; return d.innerHTML;
}

function pintar() {
  if (!ultimo) return;
  const visibles = ultimo.partidos.filter(p => delDia(p) && (!soloOp.checked || p.mercados.some(m => m.oportunidad)));
  const slugs = new Set(ultimo.partidos.map(p => p.slug));
  for (const [slug, t] of tarjetas) if (!slugs.has(slug)) { t.remove(); tarjetas.delete(slug); }
  contenedor.querySelector(".vacio")?.remove();
  // Mover un iframe en la página lo recarga (y se ve negro un momento). Por eso las
  // tarjetas de otros días solo se ocultan, y una tarjeta se mueve solo si quedó fuera de orden.
  let anterior = null;
  for (const p of ultimo.partidos) {
    let t = tarjetas.get(p.slug);
    if (!t) { t = nuevaTarjeta(p); tarjetas.set(p.slug, t); }
    const lugar = anterior ? anterior.nextElementSibling : contenedor.firstElementChild;
    if (lugar !== t) contenedor.insertBefore(t, lugar);
    anterior = t;
    t.hidden = !visibles.includes(p);
    const inicio = p.inicio ? new Date(p.inicio) : null;
    t.querySelector(".hora").textContent = inicio
      ? inicio.toLocaleString("es-MX", { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "";
    t.querySelector(".en-juego").textContent = enJuego(p) ? "● EN JUEGO" : "";
    t.querySelector(".precios").innerHTML = tabla(p);
    const marcador = marcadorHtml(p.marcador);
    if (t.querySelector(".marcador").dataset.html !== marcador) {  // solo se repinta si cambió
      t.querySelector(".marcador").innerHTML = marcador;
      t.querySelector(".marcador").dataset.html = marcador;
    }
  }
  if (!visibles.length) {
    const v = document.createElement("div");
    v.className = "vacio";
    v.textContent = soloOp.checked ? "Ningún partido tiene oportunidades de spread ahora mismo."
                  : dia === "todos" ? "No hay partidos NBA abiertos en Polymarket ahora mismo."
                                    : `No hay partidos NBA ${dia === "hoy" ? "hoy" : "mañana"} en Polymarket.`;
    contenedor.append(v);
  }
  const hora = new Date(ultimo.hora).toLocaleTimeString("es-MX");
  estado.className = ultimo.error ? "error" : "";
  estado.textContent = (ultimo.demo ? "DEMO: datos simulados · " : "") +
    (ultimo.error ? `Error: ${ultimo.error}` : `${ultimo.estado} · ${hora}`);
}

async function actualizar() {
  try {
    const r = await fetch("/api/partidos");
    ultimo = await r.json();
    pintar();
  } catch (e) {
    estado.className = "error";
    estado.textContent = "Sin conexión con dashboard.py. ¿Sigue abierto?";
  }
}

document.querySelectorAll("[data-dia]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-dia]").forEach(x => x.classList.toggle("activa", x === b));
  dia = b.dataset.dia;
  pintar();
}));

// --- Bot en papel ---------------------------------------------------------------
const bot = document.getElementById("bot");
let vista = "partidos";

// 0.48 -> "0.48"; con ticks de 0.001, 0.975 -> "0.975"
const p3 = v => v == null ? "—" : v.toFixed(Math.abs(v * 100 - Math.round(v * 100)) < 1e-6 ? 2 : 3);
const usd = v => v == null ? "—" : (v < 0 ? "-$" : "$") + Math.abs(v).toFixed(2);
const conSigno = v => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "-" : "") + "$" + Math.abs(v).toFixed(2);
const clase = v => v > 0 ? "gana" : v < 0 ? "pierde" : "";
const hora = ms => ms == null ? "—" : new Date(ms).toLocaleString("es-MX", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const mercadoTd = f => `<td class="izq">${esc(f.partido)}<br><span class="gris">${esc(f.mercado)} · ${esc(f.lado)}</span></td>`;
const MOTIVOS = { objetivo: "vendida", vendida: "vendida al precio justo", stop: "stop", ganada: "ganó el partido", perdida: "perdió el partido" };

function panelBot(e) {
  const saldoClase = clase(e.saldo - e.inicial);
  const conStop = e.abiertas.some(a => a.stop != null);
  const abiertas = e.abiertas.length ? e.abiertas.map(a => `<tr>${mercadoTd(a)}
      <td class="${a.estado.startsWith("compra") ? "pendiente" : ""}">${esc(a.estado)}</td>
      <td>${p3(a.compra)}</td><td>${p3(a.venta)}</td>${conStop ? `<td>${p3(a.stop)}</td>` : ""}
      <td>${p3(a.actual)}</td><td class="${clase(a.flotante)}">${conSigno(a.flotante)}</td></tr>`).join("")
    : `<tr><td colspan="7" class="gris">Sin órdenes abiertas: esperando una oportunidad.</td></tr>`;
  const cerradas = e.cerradas.length ? e.cerradas.map(c => `<tr><td>${hora(c.hora)}</td>${mercadoTd(c)}
      <td>${p3(c.compra)}</td><td>${p3(c.salida)}</td><td>${MOTIVOS[c.motivo] || esc(c.motivo)}</td>
      <td class="${clase(c.ganancia)}">${conSigno(c.ganancia)}</td></tr>`).join("")
    : `<tr><td colspan="6" class="gris">Todavía no hay operaciones cerradas.</td></tr>`;
  const mejores = e.mejores ? `<h3>Lo que está viendo (mejor ventaja primero)</h3><div class="tabla"><table>
      <tr><th>Lado</th><th>Polymarket</th><th>Precio justo</th><th>Ventaja</th></tr>
      ${e.mejores.length ? e.mejores.map(m => `<tr><td>${esc(m.partido)}<br><span class="gris">${esc(m.lado)}</span></td>
        <td>${p3(m.precio)}</td><td>${p3(m.justa)}</td>
        <td class="${clase(m.ventaja)}">${(m.ventaja * 100).toFixed(1)}¢</td></tr>`).join("")
        : `<tr><td colspan="4" class="gris">Sin partidos emparejados con momios todavía.</td></tr>`}
    </table></div>` : "";
  return `<article class="panel">
    <h2>${esc(e.nombre)}</h2><p class="desc">${esc(e.descripcion)}</p>
    ${e.mensaje ? `<div class="mensaje">${esc(e.mensaje)}</div>` : ""}
    <div class="cifras">
      <div class="cifra grande"><span>Saldo</span><b class="${saldoClase}">${usd(e.saldo)}</b></div>
      <div class="cifra"><span>Libre para operar</span><b>${usd(e.libre)}</b></div>
      <div class="cifra"><span>En órdenes</span><b>${usd(e.en_ordenes)}</b></div>
      <div class="cifra"><span>Ganancia cerrada</span><b class="${clase(e.realizado)}">${conSigno(e.realizado)}</b></div>
      <div class="cifra"><span>Si vendieras ya</span><b class="${clase(e.sin_realizar)}">${conSigno(e.sin_realizar)}</b></div>
    </div>
    <p class="datos">Empezó con ${usd(e.inicial)} · ${esc(e.datos)}</p>
    <h3>Órdenes abiertas</h3><div class="tabla"><table>
      <tr><th>Mercado</th><th>Estado</th><th>Compra</th><th>Venta obj.</th>${conStop ? "<th>Stop</th>" : ""}<th>Actual</th><th>Resultado</th></tr>
      ${abiertas}</table></div>
    ${mejores}
    <h3>Historial</h3><div class="tabla"><table>
      <tr><th>Hora</th><th class="izq">Mercado</th><th>Compra</th><th>Salida</th><th>Motivo</th><th>Ganancia</th></tr>
      ${cerradas}</table></div>
  </article>`;
}

async function actualizarBot() {
  try {
    const datos = await (await fetch("/api/bot")).json();
    bot.innerHTML = `<p class="aviso">Simulación con dinero ficticio${datos.demo ? " (DEMO: datos simulados, no se guarda)" : ""}.
      Corre mientras el dashboard está abierto, aunque estés en la otra pestaña.</p>` + datos.estrategias.map(panelBot).join("");
  } catch (e) {
    bot.innerHTML = `<p class="aviso">Sin conexión con dashboard.py. ¿Sigue abierto?</p>`;
  }
}

document.querySelectorAll("[data-vista]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-vista]").forEach(x => x.classList.toggle("activa", x === b));
  vista = b.dataset.vista;
  const enBot = vista === "bot";
  bot.hidden = !enBot;
  contenedor.hidden = enBot;
  document.getElementById("pie").hidden = enBot;
  document.getElementById("controles").hidden = enBot;
  if (enBot) actualizarBot();
}));
setInterval(() => { if (vista === "bot") actualizarBot(); }, 2000);
vacios.addEventListener("change", pintar);
soloOp.addEventListener("change", pintar);
actualizar();
setInterval(actualizar, 5000);
</script>
</body>
</html>
